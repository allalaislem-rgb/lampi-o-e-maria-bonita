<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0d06" />
    <link rel="icon" href="./ui/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/Rye.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/AlfaSlabOne.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lampião &amp; Maria Bonita – The Legend of the Sertão</title>
  </head>
  <body>
    <div id="game"></div>

    <!-- Loading / title screen -->
    <div id="loader">
      <div class="loader-glow"></div>
      <img class="loader-logo" src="./gfx/logo.webp" alt="Lampião & Maria Bonita – The Legend of the Sertão" />
      <div class="bar"><div class="fill"></div></div>
      <p class="hint">Riding into the sertão…</p>
      <button id="btn-play" class="gold-btn hidden">PLAY</button>
      <p class="legal">ORBIT GAMES · DEVELOPMENT PROTOTYPE · SIMULATED CREDITS · NOT CERTIFIED</p>
    </div>

    <!-- Bonus Buy -->
    <div id="buy" class="hidden">
      <img class="buy-head" src="./ui/btn_bonusbuy.webp" alt="Bonus Buy" />
      <button class="buy-btn" data-feature="greatEscape"><img src="./gfx/card_escape.webp" alt="The Great Escape" /><span class="buy-price" data-price="greatEscape">–</span></button>
      <button class="buy-btn" data-feature="hideout"><img src="./gfx/card_hideout2.webp" alt="The Hideout" /><span class="buy-price" data-price="hideout">–</span></button>
      <button class="buy-btn" data-feature="lastStand"><img src="./gfx/card_last2.webp" alt="The Last Stand" /><span class="buy-price" data-price="lastStand">–</span></button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <button class="icon-btn" id="btn-menu" title="Paytable &amp; rules" aria-label="Paytable and rules"><img src="./ui/ic_info.webp" alt="" /></button>
        <button class="icon-btn" id="btn-sound" title="Sound settings" aria-label="Sound settings"><img src="./ui/ic_sound.webp" alt="" /></button>
        <button class="icon-btn" id="btn-history" title="Round history" aria-label="Round history"><img src="./ui/btn_menu.webp" alt="" /></button>
        <button class="icon-btn" id="btn-full" title="Fullscreen" aria-label="Fullscreen"><img src="./ui/ic_full.webp" alt="" /></button>
        <button class="icon-btn" id="btn-dev" title="QA panel (development)" aria-label="QA panel"><img src="./ui/ic_settings.webp" alt="" /></button>
      </div>
      <div class="panel pan-img" id="panel-balance"><label>BALANCE</label><output id="balance">–</output></div>
      <div class="bet-group pan-img" id="panel-bet">
        <button class="bet-hit" id="bet-minus" aria-label="Decrease bet"></button>
        <div class="bet-mid"><label>BET</label><output id="bet">–</output></div>
        <button class="bet-hit" id="bet-plus" aria-label="Increase bet"></button>
      </div>
      <div class="panel pan-img" id="panel-win"><label id="win-label">WIN</label><output id="win">0.00</output></div>
      <div class="hud-right">
        <button class="icon-btn" id="btn-turbo" title="Turbo" aria-label="Turbo"><img src="./ui/btn_turbo.webp" alt="" /></button>
        <button id="btn-spin" title="Spin (Space)" aria-label="Spin"><img src="./ui/btn_spin2.webp" alt="" /><span id="auto-count"></span></button>
        <button class="icon-btn" id="btn-auto" title="Autoplay" aria-label="Autoplay"><img src="./ui/btn_auto2.webp" alt="" /></button>
      </div>
    </div>

    <div id="demo-badge">DEMO · SIMULATED CREDITS · NOT CERTIFIED</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="overlay"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
