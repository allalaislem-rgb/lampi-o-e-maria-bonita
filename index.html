<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0d06" />
    <link rel="icon" href="./ui/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/Rye.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/AlfaSlabOne.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lampião &amp; Maria Bonita – The Legend of the Sertão</title>
  </head>
  <body>
    <div id="game"></div>

    <!-- Loading / title screen -->
    <div id="loader">
      <div class="loader-glow"></div>
      <img class="loader-logo" src="./gfx/logo.webp" alt="Lampião & Maria Bonita – The Legend of the Sertão" />
      <div class="bar"><div class="fill"></div></div>
      <p class="hint">Riding into the sertão…</p>
      <button id="btn-play" class="gold-btn hidden">PLAY</button>
      <p class="legal">ORBIT GAMES · DEVELOPMENT PROTOTYPE · SIMULATED CREDITS · NOT CERTIFIED</p>
    </div>

    <!-- Bonus Buy -->
    <div id="buy" class="hidden">
      <div class="buy-head">BONUS BUY</div>
      <button class="buy-btn" data-feature="greatEscape"><img src="./gfx/title_escape.webp" alt="The Great Escape" /><span class="buy-price" data-price="greatEscape">–</span></button>
      <button class="buy-btn" data-feature="hideout"><img src="./gfx/title_hideout.webp" alt="The Hideout" /><span class="buy-price" data-price="hideout">–</span></button>
      <button class="buy-btn" data-feature="lastStand"><img src="./gfx/title_last.webp" alt="The Last Stand" /><span class="buy-price" data-price="lastStand">–</span></button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <button class="icon-btn" id="btn-menu" title="Paytable &amp; rules" aria-label="Paytable and rules"><img src="./ui/btn_info.svg" alt="" /></button>
        <button class="icon-btn" id="btn-sound" title="Sound settings" aria-label="Sound settings"><img src="./ui/btn_sound.svg" alt="" /></button>
        <button class="icon-btn" id="btn-history" title="Round history" aria-label="Round history"><img src="./ui/btn_history.svg" alt="" /></button>
        <button class="icon-btn" id="btn-dev" title="QA panel (development)" aria-label="QA panel"><img src="./ui/btn_settings.svg" alt="" /></button>
      </div>
      <div class="panel" id="panel-balance"><label>BALANCE</label><output id="balance">–</output></div>
      <div class="bet-group">
        <button class="round-btn" id="bet-minus" aria-label="Decrease bet"><img src="./ui/btn_minus.svg" alt="" /></button>
        <div class="panel" id="panel-bet"><label>BET</label><output id="bet">–</output></div>
        <button class="round-btn" id="bet-plus" aria-label="Increase bet"><img src="./ui/btn_plus.svg" alt="" /></button>
      </div>
      <div class="panel" id="panel-win"><label id="win-label">WIN</label><output id="win">0.00</output></div>
      <div class="hud-right">
        <button class="icon-btn" id="btn-turbo" title="Turbo" aria-label="Turbo"><img src="./ui/btn_turbo.svg" alt="" /></button>
        <button id="btn-spin" title="Spin (Space)" aria-label="Spin"><img src="./ui/btn_spin.svg" alt="" /><span id="auto-count"></span></button>
        <button class="icon-btn" id="btn-auto" title="Autoplay" aria-label="Autoplay"><img src="./ui/btn_auto.svg" alt="" /></button>
      </div>
    </div>

    <div id="demo-badge">DEMO · SIMULATED CREDITS · NOT CERTIFIED</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="overlay"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
